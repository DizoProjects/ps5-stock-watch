name: PS Direct PS5 Pro watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's fastest schedule; runs can start a few minutes late when GitHub is busy
  workflow_dispatch:         # lets you run it by hand from the Actions tab

concurrency:
  group: ps-direct-watch
  cancel-in-progress: false

permissions:
  contents: write            # only used for the keep-alive commit below

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # carry the last result between runs so you're alerted once, not every 5 minutes
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ps-direct-state-${{ github.run_id }}
          restore-keys: ps-direct-state-

      - name: Check PlayStation Direct
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ps_direct_check.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ps-direct-state-${{ github.run_id }}

      # GitHub pauses scheduled workflows after 60 days without commits; one tiny commit a month prevents that
      - name: Keep alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keep-alive"
            git push
          fi
